[package]
name = "snapdex"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tesseract = "0.15.2"
walkdir = "2.5"
